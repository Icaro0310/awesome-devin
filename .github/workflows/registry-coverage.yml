name: registry-coverage

# Gate: every public name in the devin-powerups registry must appear in
# the catalog (README.md). A shipped product with no catalog entry is a
# silent coverage gap — this makes it loud.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "42 5 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Unit tests (synthetic fixtures)
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -q

      - name: Registry coverage gate (fetches registry.json)
        run: python3 scripts/check_registry_coverage.py --readme README.md
